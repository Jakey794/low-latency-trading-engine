[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[features]
default = []
order_pool = []
lockfree_queue = ["dep:crossbeam-queue"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
hdrhistogram = "7"
crossbeam-queue = { version = "0.3", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "engine_hot_path"
harness = false
