[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Deterministic event-driven limit order book and matching engine."
keywords = ["trading", "order-book", "matching-engine"]
categories = ["simulation", "finance"]

[features]
default = []
order_pool = []
lockfree_queue = ["dep:crossbeam-queue"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
hdrhistogram = "7"
crossbeam-queue = { version = "0.3", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "engine_hot_path"
harness = false

[[bench]]
name = "order_pool_bench"
harness = false
required-features = ["order_pool"]

[[bench]]
name = "lockfree_queue_bench"
harness = false
required-features = ["lockfree_queue"]
